<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ตั้งรหัสผ่าน — Orbit</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23EE0B3F'/%3E%3Ccircle cx='16' cy='16.8' r='7.5' fill='none' stroke='white' stroke-width='2.9'/%3E%3Cellipse cx='16' cy='16.8' rx='11.4' ry='4.3' fill='none' stroke='white' stroke-width='2' transform='rotate(-24 16 16.8)'/%3E%3Ccircle cx='24.6' cy='7.7' r='2.75' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
  :root {
    --ink:#17161a; --ink-mid:#45424b; --ink-soft:#6d6a74; --ink-faint:#97949c;
    --paper:#ffffff; --surface:#f7f5f6; --field:#ffffff;
    --rule:#e2dee1; --rule-soft:#eeebed; --rule-strong:#cfc9ce;
    --orbit:#ee0b3f; --orbit-dk:#c50a35; --orbit-ink:#a90a30;
    --bad:#b3261e; --bad-wash:#fbeae9;
    --good:#12735a; --good-wash:#e7f3ef;
    --warn:#8a5a00; --warn-wash:#fbf2e2;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink:#eeeaef; --ink-mid:#c2bcc4; --ink-soft:#9c96a0; --ink-faint:#78737c;
      --paper:#141317; --surface:#1c1a20; --field:#1c1a20;
      --rule:#322e38; --rule-soft:#262330; --rule-strong:#413b48;
      --orbit:#ff476b; --orbit-dk:#ff2e57; --orbit-ink:#ff7b95;
      --bad:#ff8a80; --bad-wash:#2e1614;
      --good:#4fc9a3; --good-wash:#12261f;
      --warn:#e0a54a; --warn-wash:#2a2113;
    }
  }
  :root[data-theme="dark"] {
    --ink:#eeeaef; --ink-mid:#c2bcc4; --ink-soft:#9c96a0; --ink-faint:#78737c;
    --paper:#141317; --surface:#1c1a20; --field:#1c1a20;
    --rule:#322e38; --rule-soft:#262330; --rule-strong:#413b48;
    --orbit:#ff476b; --orbit-dk:#ff2e57; --orbit-ink:#ff7b95;
    --bad:#ff8a80; --bad-wash:#2e1614;
    --good:#4fc9a3; --good-wash:#12261f;
    --warn:#e0a54a; --warn-wash:#2a2113;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--surface); color: var(--ink);
    font-family: "IBM Plex Sans Thai", "Noto Sans Thai", system-ui, sans-serif;
    line-height: 1.75; display: flex; align-items: center; justify-content: center; padding: 24px;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 100%; max-width: 460px; background: var(--paper);
    border: 1px solid var(--rule); border-radius: 10px;
    box-shadow: 0 8px 32px rgba(0,0,0,.10); padding: 40px 36px 28px;
  }
  .logo { display: flex; justify-content: center; margin-bottom: 22px; }
  h1 { font-family: Anuphan, sans-serif; font-size: 23px; font-weight: 700; margin: 0 0 8px; text-align: center; }
  .lede { margin: 0 0 24px; font-size: 14.5px; color: var(--ink-soft); text-align: center; text-wrap: pretty; }

  form { display: flex; flex-direction: column; gap: 14px; }
  label { font-size: 13px; font-weight: 600; color: var(--ink-mid); display: block; margin-bottom: 5px; }
  input[type=password] {
    width: 100%; min-height: 46px; padding: 10px 13px;
    background: var(--field); color: var(--ink);
    border: 1px solid var(--rule-strong); border-radius: 8px;
    font-family: inherit; font-size: 15px;
  }
  input:focus { outline: 2px solid var(--orbit); outline-offset: 1px; border-color: var(--orbit); }

  .btn {
    display: flex; align-items: center; justify-content: center;
    width: 100%; min-height: 50px; padding: 12px 18px; margin-top: 4px;
    background: var(--orbit); color: #fff; border: 0; border-radius: 8px;
    font-family: inherit; font-size: 15.5px; font-weight: 600; cursor: pointer;
  }
  .btn:hover { background: var(--orbit-dk); }
  .btn[disabled] { opacity: .55; cursor: default; }
  .btn:focus-visible { outline: 3px solid var(--orbit); outline-offset: 3px; }

  /* รายการเงื่อนไข ติ๊กถูกทันทีที่พิมพ์ผ่าน */
  .rules { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; }
  .rules li { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-faint); }
  .rules li .tick {
    width: 16px; height: 16px; flex: none; border-radius: 50%;
    border: 1.5px solid var(--rule-strong); display: flex; align-items: center; justify-content: center;
  }
  .rules li .tick svg { display: none; }
  .rules li.ok { color: var(--good); }
  .rules li.ok .tick { border-color: var(--good); background: var(--good); }
  .rules li.ok .tick svg { display: block; }

  .msg { display: none; gap: 10px; border-radius: 8px; padding: 13px 15px; font-size: 13.5px; line-height: 1.65; }
  .msg.show { display: flex; }
  .msg svg { flex: none; margin-top: 3px; }
  .msg b { display: block; margin-bottom: 2px; }
  .msg.bad { background: var(--bad-wash); color: var(--ink-mid); } .msg.bad svg, .msg.bad b { color: var(--bad); }
  .msg.good { background: var(--good-wash); color: var(--ink-mid); } .msg.good svg, .msg.good b { color: var(--good); }
  .msg.warn { background: var(--warn-wash); color: var(--ink-mid); } .msg.warn svg, .msg.warn b { color: var(--warn); }

  .foot { margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--rule-soft);
          font-size: 12.5px; color: var(--ink-faint); line-height: 1.6; text-align: center; }
  .foot a { color: var(--ink-soft); }
</style>
</head>
<body>

<main class="card">
  <div class="logo">
    <svg width="150" height="34" viewBox="0 0 150 34" role="img" aria-label="Orbit">
      <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ff2e57"/><stop offset="1" stop-color="#c50a35"/>
      </linearGradient></defs>
      <rect x="0" y="1" width="32" height="32" rx="8" fill="url(#lg)"/>
      <circle cx="16" cy="17.8" r="7.5" fill="none" stroke="#fff" stroke-width="2.9"/>
      <ellipse cx="16" cy="17.8" rx="11.4" ry="4.3" fill="none" stroke="#fff" stroke-width="2"
               transform="rotate(-24 16 17.8)"/>
      <circle cx="24.6" cy="8.7" r="2.75" fill="#fff"/>
      <text x="42" y="25" font-family="Anuphan, sans-serif" font-size="23" font-weight="700"
            fill="currentColor" letter-spacing="-0.3">Orbit</text>
    </svg>
  </div>

  <h1 id="title">ตั้งรหัสผ่าน</h1>
  <p class="lede" id="lede">ตั้งรหัสผ่านสำหรับเข้าใช้งาน Orbit ด้วยอีเมลของคุณ</p>

  <div class="msg" id="msg">
    <svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
      <path d="M8 2.4 14.4 13.4H1.6z"/><path d="M8 6.6v3"/><path d="M8 11.4h.01"/>
    </svg>
    <div id="msgText"></div>
  </div>

  <form id="form">
    <div>
      <label for="pw1">รหัสผ่านใหม่</label>
      <input type="password" id="pw1" autocomplete="new-password" required>
    </div>

    <ul class="rules" id="rules">
      <li data-rule="len"><span class="tick"><svg width="9" height="9" viewBox="0 0 12 12" fill="none"
        stroke="#fff" stroke-width="2.2"><path d="M2 6.2 4.6 9 10 3.2"/></svg></span>ยาวอย่างน้อย 12 ตัวอักษร</li>
      <li data-rule="notcommon"><span class="tick"><svg width="9" height="9" viewBox="0 0 12 12" fill="none"
        stroke="#fff" stroke-width="2.2"><path d="M2 6.2 4.6 9 10 3.2"/></svg></span>ไม่ใช่รหัสผ่านที่คนใช้กันทั่วไป</li>
      <li data-rule="match"><span class="tick"><svg width="9" height="9" viewBox="0 0 12 12" fill="none"
        stroke="#fff" stroke-width="2.2"><path d="M2 6.2 4.6 9 10 3.2"/></svg></span>กรอกซ้ำตรงกันทั้งสองช่อง</li>
    </ul>

    <div>
      <label for="pw2">กรอกรหัสผ่านอีกครั้ง</label>
      <input type="password" id="pw2" autocomplete="new-password" required>
    </div>

    <button class="btn" type="submit" id="submitBtn" disabled>บันทึกรหัสผ่าน</button>
  </form>

  <div class="foot">
    หลังบันทึก อุปกรณ์ทั้งหมดที่เคยเข้าสู่ระบบไว้จะถูกให้ออกจากระบบ<br>
    และเราจะส่งอีเมลแจ้งให้คุณทราบ
  </div>
</main>

<script>
(function () {
  'use strict';

  var COMMON = ['password','password1','12345678','123456789','1234567890','qwertyuiop',
                'iloveyou','admin1234','letmein123','welcome123','orbit1234','srichand',
                'srichand123','abcd1234','11111111'];

  var pw1 = document.getElementById('pw1');
  var pw2 = document.getElementById('pw2');
  var btn = document.getElementById('submitBtn');
  var msg = document.getElementById('msg');
  var msgText = document.getElementById('msgText');
  var form = document.getElementById('form');

  var token = new URLSearchParams(location.search).get('token') || '';

  function show(kind, title, body) {
    msg.className = 'msg show ' + kind;
    msgText.innerHTML = '<b>' + title + '</b>' + (body || '');
  }

  if (!token) {
    show('bad', 'ลิงก์ไม่ถูกต้อง',
      'กรุณาเปิดจากลิงก์ในอีเมลที่ได้รับ หากลิงก์หมดอายุแล้ว ให้กดลืมรหัสผ่านที่หน้าเข้าสู่ระบบอีกครั้ง');
    form.style.display = 'none';
  }

  /* ตรวจเงื่อนไขฝั่งหน้าจอเพื่อให้ผู้ใช้เห็นทันทีขณะพิมพ์
     แต่เซิร์ฟเวอร์ตรวจซ้ำทุกข้ออยู่ดี ไม่เชื่อฝั่งนี้ */
  function check() {
    var a = pw1.value.normalize('NFKC');
    var b = pw2.value.normalize('NFKC');
    var st = {
      len: a.length >= 12,
      notcommon: a.length > 0 && COMMON.indexOf(a.toLowerCase()) < 0 && !/^(.)\1+$/.test(a),
      match: a.length > 0 && a === b
    };
    Object.keys(st).forEach(function (k) {
      var li = document.querySelector('[data-rule="' + k + '"]');
      if (li) li.classList.toggle('ok', st[k]);
    });
    btn.disabled = !(st.len && st.notcommon && st.match) || !token;
  }

  pw1.addEventListener('input', check);
  pw2.addEventListener('input', check);

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    btn.disabled = true;
    btn.textContent = 'กำลังบันทึก…';

    fetch('/api/auth/set-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: token, password: pw1.value })
    })
      .then(function (r) { return r.json().then(function (j) { return { s: r.status, j: j }; }); })
      .then(function (res) {
        if (res.s === 200) {
          location.href = '/login.html?changed=1';
          return;
        }
        if (res.s === 410) {
          show('warn', 'ลิงก์หมดอายุหรือถูกใช้ไปแล้ว',
            'กรุณากลับไปที่หน้าเข้าสู่ระบบแล้วกดลืมรหัสผ่านเพื่อขอลิงก์ใหม่');
          form.style.display = 'none';
          return;
        }
        show('bad', 'บันทึกไม่สำเร็จ',
          (res.j && res.j.message) || 'กรุณาตรวจสอบรหัสผ่านแล้วลองใหม่อีกครั้ง');
        btn.disabled = false;
        btn.textContent = 'บันทึกรหัสผ่าน';
      })
      .catch(function () {
        show('bad', 'เชื่อมต่อไม่สำเร็จ', 'กรุณาลองใหม่อีกครั้ง');
        btn.disabled = false;
        btn.textContent = 'บันทึกรหัสผ่าน';
      });
  });

  check();
})();
</script>
</body>
</html>
