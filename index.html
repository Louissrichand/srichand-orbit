<head>

<body>

<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <header class="topbar" id="topbar"></header>
    <section class="view" id="view"></section>
  </main>
</div>

<div class="sb-scrim" id="sbScrim"></div>
<div class="drawer-backdrop" id="drawerBackdrop"></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>

<!-- แผงตัวเลือกของมุมมอง Gantt แยกจากแผงรายละเอียดงาน เพราะเปิดค้างไว้ระหว่างปรับผังได้ -->

  <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
</div>

<!-- ไลบรารีเข้าสู่ระบบของ Microsoft ถ้าโหลดไม่ได้ แอปจะทำงานแบบเครื่องเดียวต่อไป -->
